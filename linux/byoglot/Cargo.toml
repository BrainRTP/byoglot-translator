[package]
name = "byoglot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["gui"]
gui = ["dep:gtk", "dep:adw"]

[dependencies]
byoglot-core = { path = "../byoglot-core" }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_10"], optional = true }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
oo7 = "0.7.1"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "byoglot"
path = "src/main.rs"
required-features = ["gui"]
