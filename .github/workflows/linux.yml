name: Linux

on:
  push:
    branches: [main]
    paths: ["linux/**", "contracts/**", "lib/translate/profiles/**", ".github/workflows/linux.yml"]
  pull_request:
    paths: ["linux/**", "contracts/**", "lib/translate/profiles/**", ".github/workflows/linux.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --check
      - run: cargo clippy -p byoglot-core -- -D warnings
      - run: cargo test -p byoglot-core --locked
  app:
    runs-on: ubuntu-latest
    container: fedora:45
    defaults:
      run:
        working-directory: linux
    steps:
      - name: Install system libraries
        working-directory: /
        run: dnf install -y git gtk4-devel libadwaita-devel gcc rust cargo clippy rustfmt
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the Fedora toolchain
        run: |
          /usr/bin/rustc --version
          /usr/bin/cargo --version
      - run: /usr/bin/cargo clippy --workspace --locked -- -D warnings
      - run: /usr/bin/cargo test --workspace --locked
      - run: /usr/bin/cargo build -p byoglot --release --locked
